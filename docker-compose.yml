services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    build:
      context: ./minio
    environment:
      MINIO_ROOT_USER: inventory
      MINIO_ROOT_PASSWORD: inventory-secret
    command: ["server", "/data"]
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: inventory
      MINIO_SECRET_KEY: inventory-secret
      MINIO_BUCKET: vehicle-images
      MINIO_USE_SSL: "false"
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
