# Sample for CONFIG_PATH. Docker Compose does not load this file.
# It sets environment variables instead. MinIO is not published to the host.
http_addr: ":8080"
database_url: "postgres://inventory:inventory@localhost:5432/inventory?sslmode=disable"
static_dir: "../frontend/dist"
minio_endpoint: "minio:9000"
minio_access_key: "inventory"
minio_secret_key: "inventory-secret"
minio_bucket: "vehicle-images"
minio_use_ssl: false
